name: CI
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: disputedesk
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/disputedesk
      LLM_PROVIDER: fake        # deterministic stub so unit/integration tests need no API key
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv python install 3.12
      # evals and ui groups: mypy and the page tests need deepeval and streamlit importable
      - run: uv sync --all-extras --dev --group evals --group ui
      - name: Cache RAG model weights (fastembed)
        uses: actions/cache@v4
        with:
          path: .cache/models
          key: fastembed-${{ hashFiles('src/disputedesk/config.py') }}
          restore-keys: fastembed-
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy src
      - run: uv run pytest tests/unit -q
      - run: uv run python -m disputedesk.db.seed --reset
      - run: uv run python -m disputedesk.rag.ingest
      - run: uv run pytest tests/integration -q
