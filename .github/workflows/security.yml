name: Security
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 9 * * 1"

permissions:
  contents: read
  security-events: write

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      # `uvx pip-audit` alone would audit pip-audit's own environment, not ours, so audit the
      # exact locked versions. The spaCy model is a URL requirement and cannot be audited.
      # Shipped dependencies only (--no-dev). virtualenv comes in through pre-commit, a dev tool;
      # its fixed release needs packaging>=26.3, which langfuse 2.x (packaging<25) rules out.
      # Revisit when langfuse is upgraded.
      - run: uv export --frozen --no-hashes --no-emit-project --no-dev -o requirements-audit.txt
      - run: uvx pip-audit -r requirements-audit.txt --no-deps --disable-pip

  container-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t disputedesk-api:scan -f Dockerfile .
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: disputedesk-api:scan
          # Vulnerabilities only. Trivy's secret scanner flags docstrings inside third-party
          # packages (e.g. `{"type": "service_account"}` in the anthropic SDK); repo secrets are
          # gitleaks' job, and the image holds none (.dockerignore excludes .env).
          scanners: vuln
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true

  codeql:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: python
      - uses: github/codeql-action/analyze@v3
