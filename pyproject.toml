[project]
name = "disputedesk"
version = "0.1.0"
description = "Multi-agent card-dispute resolution demo: MCP tools, RAG, guardrails, observability and evals."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "anthropic>=2.11",        # default LLM provider (only imported in llm.py)
    "fastembed>=0.9.1",        # local ONNX embeddings + cross-encoder reranker (only imported in llm.py)
    "httpx2>=2.16",           # Ollama REST calls; same client the anthropic SDK uses
    "langgraph>=1.2.24",
    "langgraph-checkpoint-postgres>=3.2.1",
    "mcp>=2.3",               # MCP Python SDK (MCPServer, formerly FastMCP) for the tool servers
    "psycopg-pool>=3.3.3",
    "psycopg[binary]>=3.3",   # Postgres driver for the stores and seed script
    "pydantic>=2.9",          # schemas for all boundary data
    "pydantic-settings>=2.6", # env-var based config
]

[dependency-groups]
dev = [
    "mypy>=1.13",
    "pre-commit>=4.0",
    "pytest>=8.3",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/disputedesk"]

# ---------- ruff ----------
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["disputedesk"]

# ---------- mypy ----------
[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

# ---------- pytest ----------
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "integration: needs running infra (Postgres etc.)",
    "models: runs real local models (downloads weights on first run)",
]
